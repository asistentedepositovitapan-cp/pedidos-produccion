<style>
  :root{
    --masa:#fbf6ee;
    --miga:#f0e6d6;
    --corteza:#8a5a34;
    --corteza-dark:#5f3c1f;
    --tinta:#2b2117;
    --acento:#c76b3f;
    --acento-suave:#f4d9c6;
    --ok:#5c7a4a;
    --linea:#e2d3ba;
    --sombra: 0 1px 3px rgba(43,33,23,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--masa);
    color:var(--tinta);
    padding-bottom:90px;
  }
  header{
    background:var(--corteza);
    color:#fff;
    padding:14px 16px 10px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:.72rem;
    opacity:.85;
    margin-bottom:10px;
  }
  .date-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.12);
    border-radius:10px;
    padding:6px 10px;
  }
  .date-row label{font-size:.75rem;opacity:.9;}
  .date-row input[type=date]{
    border:none;
    border-radius:6px;
    padding:5px 8px;
    font-size:.85rem;
    background:#fff;
    color:var(--tinta);
    flex:1;
  }
  .status-pill{
    font-size:.68rem;
    background:rgba(255,255,255,0.18);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  nav.tabs{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding:10px 12px 0;
    background:var(--corteza);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    border:none;
    background:rgba(255,255,255,0.14);
    color:#fff;
    padding:9px 14px;
    border-radius:10px 10px 0 0;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    opacity:.75;
  }
  nav.tabs button.active{
    background:var(--masa);
    color:var(--corteza-dark);
    opacity:1;
  }
  main{padding:12px;}
  .search-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .search-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--linea);
    font-size:.9rem;
    background:#fff;
  }
  .summary-btn{
    border:1px solid var(--corteza);
    background:#fff;
    color:var(--corteza-dark);
    border-radius:10px;
    padding:0 14px;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
  }
  .section{
    margin-bottom:16px;
    background:#fff;
    border-radius:12px;
    box-shadow:var(--sombra);
    overflow:hidden;
    border:1px solid var(--linea);
  }
  .section-title{
    background:var(--miga);
    padding:9px 12px;
    font-size:.78rem;
    font-weight:700;
    color:var(--corteza-dark);
    text-transform:uppercase;
    letter-spacing:.3px;
  }
  .day-label{
    padding:6px 12px;
    font-size:.72rem;
    font-style:italic;
    color:var(--acento);
    background:var(--acento-suave);
    border-top:1px solid var(--linea);
    border-bottom:1px solid var(--linea);
  }
  .prod-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-top:1px solid var(--linea);
  }
  .prod-row:first-of-type{border-top:none;}
  .prod-name{
    flex:1;
    font-size:.85rem;
    line-height:1.25;
  }
  .prod-row input[type=number]{
    width:56px;
    padding:6px 4px;
    text-align:center;
    border:1px solid var(--linea);
    border-radius:8px;
    font-size:.85rem;
  }
  .prod-row input[type=number]:focus{
    outline:2px solid var(--acento);
    border-color:var(--acento);
  }
  .field-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .field-wrap span{font-size:.6rem;color:#8a7a63;font-weight:600;}
  .prod-row.has-pedido{background:#fbf3ea;}
  .hidden{display:none !important;}
  footer.bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--linea);
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:.78rem;
    box-shadow:0 -2px 8px rgba(0,0,0,0.08);
    z-index:15;
  }
  footer.bar .save-state{color:var(--ok);font-weight:600;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,33,23,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal{
    background:#fff;
    width:100%;
    max-width:520px;
    max-height:80vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:16px;
  }
  .modal h2{margin:0 0 4px;font-size:1rem;color:var(--corteza-dark);}
  .modal .modal-sub{font-size:.75rem;color:#8a7a63;margin-bottom:10px;}
  .modal ul{list-style:none;margin:0;padding:0;}
  .modal li{
    display:flex;justify-content:space-between;
    padding:7px 0;border-bottom:1px solid var(--linea);
    font-size:.85rem;
  }
  .modal li b{color:var(--acento);}
  .modal .cat-h{font-weight:700;color:var(--corteza-dark);margin-top:10px;font-size:.8rem;text-transform:uppercase;}
  .modal-close{
    display:block;width:100%;margin-top:14px;
    padding:11px;border:none;border-radius:10px;
    background:var(--corteza);color:#fff;font-weight:600;font-size:.85rem;
  }
  .empty-msg{padding:24px 12px;text-align:center;color:#a4917a;font-size:.85rem;}
</style>
</head>

<div id="loginOverlay" class="modal-overlay" style="align-items:center;">
  <div class="modal" style="border-radius:16px; max-width:340px;">
    <h2>🥖 Pedidos de Producción</h2>
    <div class="modal-sub">Iniciá sesión para cargar o revisar pedidos</div>
    <form id="loginForm" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
      <input type="email" id="loginEmail" placeholder="Correo" required autocomplete="username" style="padding:10px;border:1px solid var(--linea);border-radius:8px;font-size:.9rem;">
      <input type="password" id="loginPass" placeholder="Contraseña" required autocomplete="current-password" style="padding:10px;border:1px solid var(--linea);border-radius:8px;font-size:.9rem;">
      <div id="loginError" style="color:#b23b3b;font-size:.78rem;min-height:14px;"></div>
      <button type="submit" class="modal-close" style="margin-top:0;">Entrar</button>
    </form>
  </div>
</div>

<header>
  <h1>🥖 Pedidos de Producción</h1>
  <div class="sub">VitaPan · Panadería · Confitería · Rotisería</div>

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha">
    <span class="status-pill" id="statusPill">conectando…</span>
  </div>
  <div class="date-row" style="margin-top:6px;">
    <span id="userBadge" style="font-size:.72rem;opacity:.85;flex:1;"></span>
    <button id="btnLogout" style="border:none;background:rgba(255,255,255,0.18);color:#fff;border-radius:8px;padding:5px 10px;font-size:.7rem;cursor:pointer;">Salir</button>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <div class="search-row">
    <input type="text" id="buscador" placeholder="Buscar producto en esta pestaña...">

    <button class="summary-btn" id="btnCombinado">Combinar 2</button>
    <button class="summary-btn" id="btnCombinado3">Combinar 3</button>
  </div>
  <div id="contenido"></div>
</main>

<footer class="bar">
  <span id="footerCount">0 productos con pedido</span>

</footer>

const CATEGORIES = Object.keys(CATALOG);

// Mapa id -> {name, cat}, para mostrar nombres en el resumen y el PDF sin recorrer todo el catálogo.
const PRODUCT_BY_ID = {};
CATEGORIES.forEach(cat=>{
  CATALOG[cat].forEach(section=>{
    section.items.forEach(item=>{
      if(item.type === 'product') PRODUCT_BY_ID[item.id] = { name: item.name, cat };
    });
  });
});

let currentUser = null;
let currentCat = CATEGORIES[0];
let currentDate = new Date().toISOString().slice(0,10);
let data = {};       // { fecha: { categoria: { id: {s,p} } } }
let lastStock = {};  // { id: {s, cat, name} }  -- último stock conocido, cruza fechas
let inputRefs = {};  // { id: {sInput, pInput, row} } -- solo de la pestaña/fecha visibles ahora
let unsubItems = null;
const debounceTimers = {};

function ensureDateBucket(fecha){
  if(!data[fecha]) data[fecha] = {};
  CATEGORIES.forEach(cat=>{ if(!data[fecha][cat]) data[fecha][cat] = {}; });
  return data[fecha];
}

// ---------- Autenticación ----------
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('userBadge').textContent = user.email;
    iniciarApp();
  } else {
    currentUser = null;
    document.getElementById('loginOverlay').classList.remove('hidden');
  }
});

document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    errEl.textContent = 'No se pudo iniciar sesión: ' + (err.message || err.code);
  });
});

document.getElementById('btnLogout').addEventListener('click', ()=> auth.signOut());

// ---------- Carga inicial + suscripciones en tiempo real ----------
async function cargarStockActualInicial(){
  try{
    const snap = await db.collection('stock_actual').get();
    snap.forEach(doc=>{
      const d = doc.data();
      lastStock[doc.id] = { s: d.s !== undefined ? d.s : '', cat: d.cat, name: d.name };
    });
  }catch(e){ console.warn('No se pudo leer stock_actual', e); }
}

function suscribirseAStockActual(){
  db.collection('stock_actual').onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      const d = change.doc.data();
      lastStock[change.doc.id] = { s: d.s !== undefined ? d.s : '', cat: d.cat, name: d.name };
    });
  });
}

async function cargarFechaInicial(fecha){
  ensureDateBucket(fecha);
  try{
    const snap = await db.collection('pedidos').doc(fecha).collection('items').get();
    snap.forEach(doc=>{
      const d = doc.data();
      if(!data[fecha][d.cat]) data[fecha][d.cat] = {};
      data[fecha][d.cat][doc.id] = { s: d.s !== undefined ? d.s : '', p: d.p !== undefined ? d.p : '' };
    });
  }catch(e){ console.warn('No se pudo leer pedidos de la fecha', e); }
}

function suscribirseAFecha(fecha){
  if(unsubItems) unsubItems();
  unsubItems = db.collection('pedidos').doc(fecha).collection('items').onSnapshot(snap=>{
    ensureDateBucket(fecha);
    snap.docChanges().forEach(change=>{
      const d = change.doc.data();
      const id = change.doc.id;
      const cat = d.cat;
      if(!data[fecha][cat]) data[fecha][cat] = {};
      data[fecha][cat][id] = { s: d.s !== undefined ? d.s : '', p: d.p !== undefined ? d.p : '' };
      actualizarCeldaEnPantalla(fecha, cat, id);
    });
    updateFooterCount();
    document.getElementById('footerSave').textContent = '✓ sincronizado ' + new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
  }, err=>{
    document.getElementById('footerSave').textContent = '⚠ sin conexión (se guarda al volver)';
  });
}

async function iniciarApp(){
  document.getElementById('statusPill').textContent = 'cargando…';
  await cargarStockActualInicial();
  suscribirseAStockActual();
  renderTabs();
  document.getElementById('fecha').value = currentDate;
  await cargarFechaInicial(currentDate);
  suscribirseAFecha(currentDate);
  renderContent();
  document.getElementById('statusPill').textContent = 'sincronizado';
}

// ---------- Guardado (con espera corta para no escribir en cada tecla) ----------
function guardarCampo(cat, id, name, campo, valor){
  ensureDateBucket(currentDate);
  if(!data[currentDate][cat]) data[currentDate][cat] = {};
  if(!data[currentDate][cat][id]) data[currentDate][cat][id] = { s:'', p:'' };
  data[currentDate][cat][id][campo] = valor;

  const key = currentDate + '_' + id + '_' + campo;
  clearTimeout(debounceTimers[key]);
  document.getElementById('footerSave').textContent = '… guardando';
  debounceTimers[key] = setTimeout(()=>{
    const ref = db.collection('pedidos').doc(currentDate).collection('items').doc(id);
    console.log('Guardando en pedidos/' + currentDate + '/items/' + id, { cat, name, [campo]: valor });
    ref.set({
      cat, name, [campo]: valor,
      actualizadoPor: currentUser ? currentUser.email : '',
      actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true }).then(()=>{
      console.log('Guardado OK en pedidos/' + currentDate + '/items/' + id);
    }).catch((err)=>{
      console.error('ERROR al guardar en pedidos/' + currentDate + '/items/' + id, err);
      document.getElementById('footerSave').textContent = '⚠ error: ' + (err.code || err.message || err);
    });

    if(campo === 's'){
      db.collection('stock_actual').doc(id).set({
        cat, name, s: valor,
        actualizadoPor: currentUser ? currentUser.email : '',
        actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true }).catch((err)=>{ console.error('ERROR al guardar stock_actual', err); });
    }
  }, 450);
}

// ---------- Render ----------
function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const b = document.createElement('button');
    b.textContent = cat;
    b.className = cat === currentCat ? 'active' : '';
    b.onclick = ()=>{ currentCat = cat; document.getElementById('buscador').value=''; renderTabs(); renderContent(); };
    tabsEl.appendChild(b);
  });
}

function updateFooterCount(){
  const bucket = ensureDateBucket(currentDate);
  let count = 0;
  CATEGORIES.forEach(cat=>{
    Object.values(bucket[cat]).forEach(e=>{ if(e.p !== '' && Number(e.p) > 0) count++; });
  });
  document.getElementById('footerCount').textContent = count + (count===1 ? ' producto con pedido' : ' productos con pedido');
}

function actualizarCeldaEnPantalla(fecha, cat, id){
  if(fecha !== currentDate || cat !== currentCat) return;
  const refs = inputRefs[id];
  if(!refs) return;
  const entry = (data[fecha][cat] && data[fecha][cat][id]) || { s:'', p:'' };
  if(document.activeElement !== refs.sInput) refs.sInput.value = entry.s;
  if(document.activeElement !== refs.pInput) refs.pInput.value = entry.p;
  refs.row.classList.toggle('has-pedido', Number(entry.p) > 0);
}

function renderContent(){
  const cont = document.getElementById('contenido');
  cont.innerHTML = '';
  inputRefs = {};
  const filtro = document.getElementById('buscador').value.trim().toLowerCase();
  const sections = CATALOG[currentCat];
  const bucket = ensureDateBucket(currentDate);
  let anyVisible = false;

  sections.forEach(section=>{
    const secEl = document.createElement('div');
    secEl.className = 'section';
    let secHasVisible = false;

    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.textContent = section.title;
    secEl.appendChild(titleEl);

    section.items.forEach(item=>{
      if(item.type === 'day'){
        const d = document.createElement('div');
        d.className = 'day-label';
        d.textContent = item.label;
        secEl.appendChild(d);
        return;
      }
      const { id, name } = item;
      if(filtro && !name.toLowerCase().includes(filtro)) return;
      secHasVisible = true; anyVisible = true;

      const existente = bucket[currentCat][id];
      const entry = existente || { s: (lastStock[id] ? lastStock[id].s : ''), p: '' };

      const row = document.createElement('div');
      row.className = 'prod-row' + (Number(entry.p) > 0 ? ' has-pedido' : '');

      const nameEl = document.createElement('div');
      nameEl.className = 'prod-name';
      nameEl.textContent = name;
      row.appendChild(nameEl);

      const sWrap = document.createElement('div');
      sWrap.className = 'field-wrap';
      sWrap.innerHTML = '<span>Stock</span>';
      const sInput = document.createElement('input');
      sInput.type = 'number'; sInput.min = '0'; sInput.inputMode='decimal';
      sInput.value = entry.s;
      sInput.addEventListener('input', ()=>{
        guardarCampo(currentCat, id, name, 's', sInput.value);
      });
      sWrap.appendChild(sInput);
      row.appendChild(sWrap);

      const pWrap = document.createElement('div');
      pWrap.className = 'field-wrap';
      pWrap.innerHTML = '<span>Pedido</span>';
      const pInput = document.createElement('input');
      pInput.type = 'number'; pInput.min = '0'; pInput.inputMode='decimal';
      pInput.value = entry.p;
      pInput.addEventListener('input', ()=>{
        row.classList.toggle('has-pedido', Number(pInput.value) > 0);
        guardarCampo(currentCat, id, name, 'p', pInput.value);
        updateFooterCount();
      });
      pWrap.appendChild(pInput);
      row.appendChild(pWrap);

      inputRefs[id] = { sInput, pInput, row };
      secEl.appendChild(row);
    });

    if(secHasVisible) cont.appendChild(secEl);
  });

  if(!anyVisible){
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = filtro ? 'No se encontraron productos con "' + filtro + '"' : 'No hay productos en esta categoría.';
    cont.appendChild(msg);
  }
  updateFooterCount();
}

function renderResumen(){
  const bucket = ensureDateBucket(currentDate);
  const root = document.getElementById('modalRoot');
  let html = '<div class="modal-overlay" id="ovResumen"><div class="modal">';
  html += '<h2>Resumen del pedido</h2>';
  html += '<div class="modal-sub">Fecha: ' + currentDate + ' · productos con pedido cargado</div>';

  let totalItems = 0;
  CATEGORIES.forEach(cat=>{
    const entries = Object.entries(bucket[cat]).filter(([id,e])=> e.p !== '' && Number(e.p) > 0);
    if(entries.length === 0) return;
    html += '<div class="cat-h">' + cat + '</div><ul>';
    entries.forEach(([id, e])=>{
      totalItems++;
      const nombre = (PRODUCT_BY_ID[id] && PRODUCT_BY_ID[id].name) || id;
      html += '<li><span>' + nombre + '</span><b>' + e.p + '</b></li>';
    });
    html += '</ul>';
  });

  if(totalItems === 0){
    html += '<p style="font-size:.85rem;color:#a4917a;">Todavía no cargaste ningún pedido para esta fecha.</p>';
  }

  html += '<button class="modal-close" id="closeResumen">Cerrar</button>';
  html += '</div></div>';
  root.innerHTML = html;
  document.getElementById('closeResumen').onclick = ()=>{ root.innerHTML = ''; };
  document.getElementById('ovResumen').addEventListener('click', (e)=>{ if(e.target.id === 'ovResumen') root.innerHTML=''; });
}

// ---------- PDF ----------
function construirCuerpoCategoria(cat, bucket){
  const body = [];
  const boundaries = [];
  CATALOG[cat].forEach(section=>{
    boundaries.push(body.length);
    body.push([{ content: section.title, colSpan: 3, styles:{ fillColor:[227,227,227], textColor:[20,20,20], fontStyle:'bold' } }]);
    section.items.forEach(item=>{
      if(item.type === 'day'){
        body.push([{ content: item.label, colSpan: 3, styles:{ fontStyle:'italic', fillColor: false, textColor:[95,95,95] } }]);
      } else {
        const existente = bucket[cat] && bucket[cat][item.id];
        const e = existente || { s: (lastStock[item.id] ? lastStock[item.id].s : ''), p: '' };
        body.push([item.name, e.s !== '' ? String(e.s) : '', e.p !== '' ? String(e.p) : '']);
      }
    });
  });
  return { body, boundaries };
}

function medirAlturaCuerpo(doc, body, fontSize, cellPadding, colWidth){
  doc.setFontSize(fontSize);
  const anchoFijo = 12; // S y P ahora se ajustan al contenido (números cortos), ocupan poco
  const anchoNombre = Math.max(15, colWidth - anchoFijo*2 - cellPadding*6 - 6);
  const anchoColSpan = Math.max(15, colWidth - cellPadding*2 - 4);
  const lineH = fontSize*1.15 + cellPadding*2;
  let total = 0;
  body.forEach(row=>{
    if(row.length === 1){
      const lineas = doc.splitTextToSize(String(row[0].content), anchoColSpan).length;
      total += lineH * lineas;
    } else {
      const lineas = doc.splitTextToSize(String(row[0]), anchoNombre).length;
      total += lineH * lineas;
    }
  });
  return total * 1.05;
}

// Elige los n-1 puntos de corte (siempre al inicio de una sección) que mejor reparten el alto
// estimado entre las n columnas de la hoja.
function elegirCortesMultiples(doc, body, boundaries, colWidth, n){
  if(n <= 1) return [];
  const candidatos = boundaries.filter(b=>b>0 && b<body.length);
  if(candidatos.length === 0){
    const cortes = [];
    for(let k=1;k<n;k++) cortes.push(Math.round(body.length*k/n));
    return cortes;
  }
  const refFont = 6.5, refPad = 1.3;
  const total = medirAlturaCuerpo(doc, body, refFont, refPad, colWidth);
  const alturasAcum = candidatos.map(b => ({ b, h: medirAlturaCuerpo(doc, body.slice(0,b), refFont, refPad, colWidth) }));
  const cortes = [];
  for(let k=1;k<n;k++){
    const objetivo = total * k / n;
    const prev = cortes.length ? cortes[cortes.length-1] : 0;
    let mejor = null, mejorDiff = Infinity;
    alturasAcum.forEach(({b,h})=>{
      if(b <= prev) return;
      const diff = Math.abs(h - objetivo);
      if(diff < mejorDiff){ mejorDiff = diff; mejor = b; }
    });
    if(mejor === null) mejor = Math.max(prev+1, Math.round(body.length*k/n));
    cortes.push(mejor);
  }
  return cortes;
}

function partirEnColumnas(body, cortes){
  const partes = [];
  let desde = 0;
  cortes.forEach(c=>{ partes.push(body.slice(desde, c)); desde = c; });
  partes.push(body.slice(desde));
  return partes;
}

function ajustarFuenteN(doc, bodies, colWidth, alturaDisponible){
  let fontSize = 8;
  let cellPadding = 2;
  while(fontSize > 3){
    cellPadding = Math.max(0.3, Math.min(2, fontSize*0.22));
    const headFontSize = Math.min(fontSize+0.5, 8.5);
    const altoHeader = headFontSize*1.15 + cellPadding*2;
    const alturas = bodies.map(b => medirAlturaCuerpo(doc, b, fontSize, cellPadding, colWidth) + altoHeader);
    if(Math.max(...alturas) <= alturaDisponible) break;
    fontSize -= 0.1;
  }
  return { fontSize: Math.max(fontSize, 3), cellPadding };
}

function renderizarColumnas(doc, bodies, topY){
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 22, gutter = 10;
  const n = bodies.length;
  const colWidth = (pageW - margin*2 - gutter*(n-1)) / n;
  const alturaDisponible = pageH - topY - margin;

  const { fontSize, cellPadding } = ajustarFuenteN(doc, bodies, colWidth, alturaDisponible);

  const estiloBase = {
    styles:{ fontSize:fontSize, cellPadding:cellPadding, textColor:[20,20,20], lineColor:[180,180,180], lineWidth:0.4, overflow:'linebreak' },
    headStyles:{ fillColor:[70,70,70], textColor:255, fontSize:Math.min(fontSize+0.5, 8.5) },
    // Las 3 columnas se ajustan a lo que realmente necesitan (nombre, y los números cortos de S/P)
    // en vez de reservar siempre el mismo ancho fijo. Encabezados S/P como en la planilla original.
    columnStyles:{ 0:{ cellWidth:'wrap' }, 1:{ cellWidth:'wrap', halign:'center' }, 2:{ cellWidth:'wrap', halign:'center' } },
    pageBreak:'avoid'
  };

  bodies.forEach((b, i)=>{
    const left = margin + i*(colWidth + gutter);
    const right = pageW - left - colWidth;
    doc.autoTable(Object.assign({
      head: [['Producto','S','P']],
      body: b,
      startY: topY,
      margin:{ left: left, right: right },
      tableWidth: 'wrap'
    }, estiloBase));
  });
}

function dibujarEncabezadoPDF(doc, titulo){
  doc.setTextColor(0,0,0);
  doc.setFontSize(11);
  doc.text(titulo, 22, 18);
  doc.setFontSize(8);
  doc.setTextColor(70,70,70);
  doc.text('Fecha: ' + currentDate, 22, 30);
  doc.text('VitaPan', doc.internal.pageSize.getWidth() - 22, 30, { align:'right' });
}

function generarPDF(){
  if(!window.jspdf){
    alert('No se pudo cargar el generador de PDF. Verificá tu conexión a internet e intentá de nuevo.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const bucket = ensureDateBucket(currentDate);

  dibujarEncabezadoPDF(doc, 'PLANILLA DE PEDIDO - ' + currentCat.toUpperCase());

  const n = 2; // una sola categoría siempre se reparte en 2 columnas
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 22, gutter = 10;
  const colWidth = (pageW - margin*2 - gutter*(n-1)) / n;
  const { body, boundaries } = construirCuerpoCategoria(currentCat, bucket);
  const cortes = elegirCortesMultiples(doc, body, boundaries, colWidth, n);

  renderizarColumnas(doc, partirEnColumnas(body, cortes), 46);

  doc.save('Pedido_' + currentCat.replace(/\s+/g,'_') + '_' + currentDate + '.pdf');
}

function generarPDFCombinado(cats){
  if(!window.jspdf){
    alert('No se pudo cargar el generador de PDF. Verificá tu conexión a internet e intentá de nuevo.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const bucket = ensureDateBucket(currentDate);

  dibujarEncabezadoPDF(doc, 'PLANILLA DE PEDIDO - ' + cats.map(c=>c.toUpperCase()).join(' / '));

  // Todas las categorías elegidas se unen en un solo flujo (como una sola planilla larga) y se
  // reparten en tantas columnas como categorías combinadas — así cada columna es más corta y
  // entra letra más grande, en vez de apretar todo siempre en solo 2 columnas.
  let bodyCombinado = [];
  let boundariesCombinado = [];
  cats.forEach(cat=>{
    const r = construirCuerpoCategoria(cat, bucket);
    const offset = bodyCombinado.length;
    bodyCombinado = bodyCombinado.concat(r.body);
    boundariesCombinado = boundariesCombinado.concat(r.boundaries.map(b => b + offset));
  });

  const n = cats.length;
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 22, gutter = 10;
  const colWidth = (pageW - margin*2 - gutter*(n-1)) / n;
  const cortes = elegirCortesMultiples(doc, bodyCombinado, boundariesCombinado, colWidth, n);

  renderizarColumnas(doc, partirEnColumnas(bodyCombinado, cortes), 46);

  doc.save('Pedido_' + cats.map(c=>c.replace(/\s+/g,'_')).join('_') + '_' + currentDate + '.pdf');
}

function abrirSelectorCombinado(cantidad){
  const root = document.getElementById('modalRoot');
  let html = '<div class="modal-overlay" id="ovCombinado"><div class="modal">';
  html += '<h2>Combinar ' + cantidad + ' pestañas en una hoja</h2>';
  html += '<div class="modal-sub">Marcá exactamente ' + cantidad + ' categorías</div>';
  html += '<ul style="list-style:none;padding:0;margin:0;">';
  CATEGORIES.forEach((cat,i)=>{
    html += '<li style="padding:8px 0;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:8px;">'
      + '<input type="checkbox" class="chkCombo" value="' + cat + '" id="chkCombo' + i + '">'
      + '<label for="chkCombo' + i + '" style="font-size:.85rem;">' + cat + '</label></li>';
  });
  html += '</ul>';
  html += '<button class="modal-close" id="generarCombinadoBtn">Generar PDF</button>';
  html += '</div></div>';
  root.innerHTML = html;
  document.getElementById('ovCombinado').addEventListener('click', (e)=>{ if(e.target.id === 'ovCombinado') root.innerHTML = ''; });
  document.getElementById('generarCombinadoBtn').onclick = ()=>{
    const seleccion = Array.from(document.querySelectorAll('.chkCombo:checked')).map(el=>el.value);
    if(seleccion.length !== cantidad){
      alert('Elegí exactamente ' + cantidad + ' categorías para combinar.');
      return;
    }
    root.innerHTML = '';
    generarPDFCombinado(seleccion);
  };
}
