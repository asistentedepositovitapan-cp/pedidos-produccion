<style>
  :root{
    --masa:#fbf6ee;
    --miga:#f0e6d6;
    --corteza:#8a5a34;
    --corteza-dark:#5f3c1f;
    --tinta:#2b2117;
    --acento:#c76b3f;
    --acento-suave:#f4d9c6;
    --ok:#5c7a4a;
    --linea:#e2d3ba;
    --sombra: 0 1px 3px rgba(43,33,23,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--masa);
    color:var(--tinta);
    padding-bottom:90px;
  }
  header{
    background:var(--corteza);
    color:#fff;
    padding:14px 16px 10px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:.72rem;
    opacity:.85;
    margin-bottom:10px;
  }
  .date-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.12);
    border-radius:10px;
    padding:6px 10px;
  }
  .date-row label{font-size:.75rem;opacity:.9;}
  .date-row input[type=date]{
    border:none;
    border-radius:6px;
    padding:5px 8px;
    font-size:.85rem;
    background:#fff;
    color:var(--tinta);
    flex:1;
  }
  .status-pill{
    font-size:.68rem;
    background:rgba(255,255,255,0.18);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  nav.tabs{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding:10px 12px 0;
    background:var(--corteza);
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    border:none;
    background:rgba(255,255,255,0.14);
    color:#fff;
    padding:9px 14px;
    border-radius:10px 10px 0 0;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    opacity:.75;
  }
  nav.tabs button.active{
    background:var(--masa);
    color:var(--corteza-dark);
    opacity:1;
  }
  main{padding:12px;}
  .search-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .search-row input{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--linea);
    font-size:.9rem;
    background:#fff;
  }
  .summary-btn{
    border:1px solid var(--corteza);
    background:#fff;
    color:var(--corteza-dark);
    border-radius:10px;
    padding:0 14px;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
  }
  .section{
    margin-bottom:16px;
    background:#fff;
    border-radius:12px;
    box-shadow:var(--sombra);
    overflow:hidden;
    border:1px solid var(--linea);
  }
  .section-title{
    background:var(--miga);
    padding:9px 12px;
    font-size:.78rem;
    font-weight:700;
    color:var(--corteza-dark);
    text-transform:uppercase;
    letter-spacing:.3px;
  }
  .day-label{
    padding:6px 12px;
    font-size:.72rem;
    font-style:italic;
    color:var(--acento);
    background:var(--acento-suave);
    border-top:1px solid var(--linea);
    border-bottom:1px solid var(--linea);
  }
  .prod-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-top:1px solid var(--linea);
  }
  .prod-row:first-of-type{border-top:none;}
  .prod-name{
    flex:1;
    font-size:.85rem;
    line-height:1.25;
  }
  .prod-row input[type=number]{
    width:56px;
    padding:6px 4px;
    text-align:center;
    border:1px solid var(--linea);
    border-radius:8px;
    font-size:.85rem;
  }
  .prod-row input[type=number]:focus{
    outline:2px solid var(--acento);
    border-color:var(--acento);
  }
  .field-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .field-wrap span{font-size:.6rem;color:#8a7a63;font-weight:600;}
  .prod-row.has-pedido{background:#fbf3ea;}
  .hidden{display:none !important;}
  footer.bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid var(--linea);
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:.78rem;
    box-shadow:0 -2px 8px rgba(0,0,0,0.08);
    z-index:15;
  }
  footer.bar .save-state{color:var(--ok);font-weight:600;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(43,33,23,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal{
    background:#fff;
    width:100%;
    max-width:520px;
    max-height:80vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:16px;
  }
  .modal h2{margin:0 0 4px;font-size:1rem;color:var(--corteza-dark);}
  .modal .modal-sub{font-size:.75rem;color:#8a7a63;margin-bottom:10px;}
  .modal ul{list-style:none;margin:0;padding:0;}
  .modal li{
    display:flex;justify-content:space-between;
    padding:7px 0;border-bottom:1px solid var(--linea);
    font-size:.85rem;
  }
  .modal li b{color:var(--acento);}
  .modal .cat-h{font-weight:700;color:var(--corteza-dark);margin-top:10px;font-size:.8rem;text-transform:uppercase;}
  .modal-close{
    display:block;width:100%;margin-top:14px;
    padding:11px;border:none;border-radius:10px;
    background:var(--corteza);color:#fff;font-weight:600;font-size:.85rem;
  }
  .empty-msg{padding:24px 12px;text-align:center;color:#a4917a;font-size:.85rem;}
</style>
</head>

<style>
  #splashScreen{position:fixed;inset:0;z-index:9999;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;transition:opacity .45s ease;cursor:pointer;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #splashScreen .sp-emoji-main{font-size:5.2rem;animation:spPop 1.4s ease-out both, spFloat 3s ease-in-out 1.4s infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));}
  #splashScreen .sp-hola{font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase;opacity:.9;margin-top:10px;animation:spUp .8s .3s both;}
  #splashScreen .sp-titulo{font-size:2.6rem;font-weight:800;line-height:1.1;margin:4px 14px 0;text-shadow:0 3px 10px rgba(0,0,0,.25);animation:spUp .8s .5s both;}
  #splashScreen .sp-sub{font-size:1rem;margin:10px 24px 0;opacity:.95;animation:spUp .8s .7s both;}
  #splashScreen .sp-app{position:absolute;bottom:26px;left:0;right:0;font-size:.78rem;opacity:.85;letter-spacing:.05em;}
  #splashScreen .sp-part{position:absolute;top:-12%;animation:spFall linear infinite;pointer-events:none;user-select:none;}
  @keyframes spFall{to{transform:translateY(125vh) rotate(360deg);}}
  @keyframes spPop{0%{transform:scale(.2) rotate(-20deg);opacity:0;}60%{transform:scale(1.15) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
  @keyframes spFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @keyframes spUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
</style>

<script>

(function(){
  var MESES = [
    {n:'Enero',   bg:['#ff9a3c','#f2545b'], e:'☀️', p:['🏖️','🍉','☀️','🍦'],      s:'Arrancamos el año con todo'},

    {n:'Mayo',    bg:['#3f6fd8','#c0392b'], e:'🇵🇾', p:['🇵🇾','⭐','🌹','🥖'],      s:'Mes de la Patria'},
    {n:'Junio',   bg:['#4b79a1','#283e51'], e:'🧣', p:['❄️','☕','🧣','🥐'],      s:'Frío y café calentito'},
    {n:'Julio',   bg:['#5c6bc0','#1a237e'], e:'☕', p:['❄️','☕','🍩','🥖'],      s:'Pleno invierno, pan recién hecho'},
    {n:'Agosto',  bg:['#f7b955','#e0782b'], e:'🎈', p:['🎈','🎁','🎉','🥳'],      s:'Mes de los cumpleaños y del niño'},
    {n:'Septiembre',bg:['#56ab2f','#a8e063'],e:'🌸', p:['🌸','🌼','🦋','🌷'],     s:'Llegó la primavera'},
    {n:'Octubre', bg:['#ff8c00','#4a235a'], e:'🍁', p:['🍁','🍂','🎃','🥧'],      s:'Un mes lleno de color'},
    {n:'Noviembre',bg:['#11998e','#38ef7d'],e:'🌿', p:['🌿','🌻','☀️','🍞'],      s:'Ya se siente el verano'},
    {n:'Diciembre',bg:['#b31217','#0f5132'],e:'🎄', p:['🎄','⭐','🎁','❄️'],      s:'Tiempo de brindar y compartir'}
  ];
  // Fechas especiales "mes-día" (tienen prioridad sobre el tema del mes). Rangos: desde-hasta en el mismo mes.
  var ESPECIALES = [
    {m:1,  d1:1,  d2:1,  hola:'¡Feliz', t:'Año Nuevo!',           bg:['#141e30','#c9a227'], e:'🎆', p:['🎆','🥂','✨','🎇'], s:'Que sea un gran año'},
    {m:3,  d1:1,  d2:1,  hola:'Hoy es el', t:'Día de los Héroes', bg:['#c0392b','#2c5fb3'], e:'🇵🇾', p:['🇵🇾','⭐'], s:'Con orgullo paraguayo'},
    {m:5,  d1:1,  d2:1,  hola:'¡Feliz', t:'Día del Trabajador!',  bg:['#2c5fb3','#c0392b'], e:'👷', p:['🛠️','⭐','🥖'], s:'Gracias por tu esfuerzo'},
    {m:5,  d1:14, d2:15, hola:'¡Viva la', t:'Independencia!',     bg:['#c0392b','#2c5fb3'], e:'🇵🇾', p:['🇵🇾','⭐','🎉'], s:'Paraguay, 14 y 15 de mayo'},
    {m:6,  d1:12, d2:12, hola:'Hoy es el', t:'Día de la Paz del Chaco', bg:['#2c5fb3','#c0392b'], e:'🕊️', p:['🕊️','🇵🇾'], s:'Paz y memoria'},
    {m:8,  d1:15, d2:15, hola:'¡Feliz', t:'Cumple Asunción!',     bg:['#f7b955','#2c5fb3'], e:'🏙️', p:['🎉','🇵🇾','🎈'], s:'Fundación de Asunción'},

  var hoy = new Date(), m = hoy.getMonth()+1, d = hoy.getDate();
  var tema = null;
  for(var i=0;i<ESPECIALES.length;i++){ var x=ESPECIALES[i]; if(x.m===m && d>=x.d1 && d<=x.d2){ tema=x; break; } }

})();
</script>

const PRODUCT_BY_ID = {};

  Object.keys(area.catalog).forEach(cat=>{
    area.catalog[cat].forEach(section=>{
      section.items.forEach(item=>{
        if(item.type === 'product') PRODUCT_BY_ID[item.id] = { name: item.name, cat };
      });
    });
  });
});

function ensureDateBucket(fecha){
  if(!data[currentArea]) data[currentArea] = {};
  if(!data[currentArea][fecha]) data[currentArea][fecha] = {};
  categoriasActuales().forEach(cat=>{ if(!data[currentArea][fecha][cat]) data[currentArea][fecha][cat] = {}; });
  return data[currentArea][fecha];
}

// ---------- Carga inicial + suscripciones en tiempo real ----------
async function cargarStockActualInicial(area){
  try{
    const snap = await db.collection(AREAS[area].coleccionStock).get();
    if(!lastStock[area]) lastStock[area] = {};
    snap.forEach(doc=>{
      const d = doc.data();
      lastStock[area][doc.id] = { s: d.s !== undefined ? d.s : '', cat: d.cat, name: d.name };
    });
  }catch(e){ console.warn('No se pudo leer stock_actual de ' + area, e); }
}

function suscribirseAStockActual(area){
  db.collection(AREAS[area].coleccionStock).onSnapshot(snap=>{
    if(!lastStock[area]) lastStock[area] = {};
    snap.docChanges().forEach(change=>{
      const d = change.doc.data();
      lastStock[area][change.doc.id] = { s: d.s !== undefined ? d.s : '', cat: d.cat, name: d.name };
    });
  });
}

async function cargarFechaInicial(fecha){
  const bucket = ensureDateBucket(fecha);
  try{
    const snap = await db.collection(coleccionPedidosActual()).doc(fecha).collection('items').get();
    snap.forEach(doc=>{
      const d = doc.data();
      if(!bucket[d.cat]) bucket[d.cat] = {};
      bucket[d.cat][doc.id] = { s: d.s !== undefined ? d.s : '', p: d.p !== undefined ? d.p : '' };
    });
  }catch(e){ console.warn('No se pudo leer pedidos de la fecha', e); }
}

function suscribirseAFecha(fecha){
  if(unsubItems) unsubItems();
  const area = currentArea;
  unsubItems = db.collection(coleccionPedidosActual()).doc(fecha).collection('items').onSnapshot(snap=>{
    const bucket = ensureDateBucket(fecha);
    snap.docChanges().forEach(change=>{
      const d = change.doc.data();
      const id = change.doc.id;
      const cat = d.cat;
      if(!bucket[cat]) bucket[cat] = {};
      bucket[cat][id] = { s: d.s !== undefined ? d.s : '', p: d.p !== undefined ? d.p : '' };
      actualizarCeldaEnPantalla(area, fecha, cat, id);
    });
    updateFooterCount();
    document.getElementById('footerSave').textContent = '✓ sincronizado ' + new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
  }, err=>{
    document.getElementById('footerSave').textContent = '⚠ sin conexión (se guarda al volver)';
  });
}

// ---------- Guardado (con espera corta para no escribir en cada tecla) ----------
function guardarCampo(cat, id, name, campo, valor){
  const bucket = ensureDateBucket(currentDate);
  if(!bucket[cat]) bucket[cat] = {};
  if(!bucket[cat][id]) bucket[cat][id] = { s:'', p:'' };
  bucket[cat][id][campo] = valor;

  const area = currentArea;
  const fecha = currentDate;
  const key = area + '_' + fecha + '_' + id + '_' + campo;
  clearTimeout(debounceTimers[key]);
  document.getElementById('footerSave').textContent = '… guardando';
  debounceTimers[key] = setTimeout(()=>{
    const ref = db.collection(AREAS[area].coleccionPedidos).doc(fecha).collection('items').doc(id);
    console.log('Guardando en ' + AREAS[area].coleccionPedidos + '/' + fecha + '/items/' + id, { cat, name, [campo]: valor });
    ref.set({
      cat, name, [campo]: valor,
      actualizadoPor: currentUser ? currentUser.email : '',
      actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true }).then(()=>{
      console.log('Guardado OK en ' + AREAS[area].coleccionPedidos + '/' + fecha + '/items/' + id);
    }).catch((err)=>{
      console.error('ERROR al guardar en ' + AREAS[area].coleccionPedidos + '/' + fecha + '/items/' + id, err);
      document.getElementById('footerSave').textContent = '⚠ error: ' + (err.code || err.message || err);
    });

    if(campo === 's'){
      db.collection(AREAS[area].coleccionStock).doc(id).set({
        cat, name, s: valor,
        actualizadoPor: currentUser ? currentUser.email : '',
        actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true }).catch((err)=>{ console.error('ERROR al guardar stock_actual', err); });
    }
  }, 450);
}

function updateFooterCount(){

  let count = 0;

  });

}

function actualizarCeldaEnPantalla(area, fecha, cat, id){
  if(area !== currentArea || fecha !== currentDate || cat !== currentCat) return;
  const refs = inputRefs[id];
  if(!refs) return;
  const bucket = data[area] && data[area][fecha];
  const entry = (bucket && bucket[cat] && bucket[cat][id]) || { s:'', p:'' };
  if(document.activeElement !== refs.sInput) refs.sInput.value = entry.s;
  if(document.activeElement !== refs.pInput) refs.pInput.value = entry.p;
  refs.row.classList.toggle('has-pedido', Number(entry.p) > 0);
}

function renderContent(){
  const cont = document.getElementById('contenido');
  cont.innerHTML = '';
  inputRefs = {};
  const filtro = document.getElementById('buscador').value.trim().toLowerCase();
  const sections = catalogoActual()[currentCat];
  const bucket = ensureDateBucket(currentDate);
  let anyVisible = false;

  sections.forEach(section=>{
    const secEl = document.createElement('div');
    secEl.className = 'section';
    let secHasVisible = false;

    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.textContent = section.title;
    secEl.appendChild(titleEl);

    section.items.forEach(item=>{
      if(item.type === 'day'){
        const d = document.createElement('div');
        d.className = 'day-label';
        d.textContent = item.label;
        secEl.appendChild(d);
        return;
      }
      const { id, name } = item;
      if(filtro && !name.toLowerCase().includes(filtro)) return;
      secHasVisible = true; anyVisible = true;

      const existente = bucket[currentCat][id];
      const stockPrevio = lastStock[currentArea] && lastStock[currentArea][id];
      const entry = existente || { s: (stockPrevio ? stockPrevio.s : ''), p: '' };

      const row = document.createElement('div');
      row.className = 'prod-row' + (Number(entry.p) > 0 ? ' has-pedido' : '');

      const nameEl = document.createElement('div');
      nameEl.className = 'prod-name';
      nameEl.textContent = name;
      row.appendChild(nameEl);

      const sWrap = document.createElement('div');
      sWrap.className = 'field-wrap';
      sWrap.innerHTML = '<span>Stock</span>';
      const sInput = document.createElement('input');
      sInput.type = 'number'; sInput.min = '0'; sInput.inputMode='decimal';
      sInput.value = entry.s;
      sInput.addEventListener('input', ()=>{
        guardarCampo(currentCat, id, name, 's', sInput.value);
      });
      sWrap.appendChild(sInput);
      row.appendChild(sWrap);

      const pWrap = document.createElement('div');
      pWrap.className = 'field-wrap';
      pWrap.innerHTML = '<span>Pedido</span>';
      const pInput = document.createElement('input');
      pInput.type = 'number'; pInput.min = '0'; pInput.inputMode='decimal';
      pInput.value = entry.p;
      pInput.addEventListener('input', ()=>{
        row.classList.toggle('has-pedido', Number(pInput.value) > 0);
        guardarCampo(currentCat, id, name, 'p', pInput.value);
        updateFooterCount();
      });
      pWrap.appendChild(pInput);
      row.appendChild(pWrap);

      inputRefs[id] = { sInput, pInput, row };
      secEl.appendChild(row);
    });

    if(secHasVisible) cont.appendChild(secEl);
  });

  if(!anyVisible){
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = filtro ? 'No se encontraron productos con "' + filtro + '"' : 'No hay productos en esta categoría.';
    cont.appendChild(msg);
  }
  updateFooterCount();
}

// PDF del resumen: misma presentación que se ve en pantalla (categoría, producto a la izquierda, cantidad a la derecha).
function generarPDFResumen(){
  if(!window.jspdf){ alert('No se pudo cargar el generador de PDF. Revisá tu conexión e intentá de nuevo.'); return; }
  const bucket = ensureDateBucket(currentDate);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4', orientation:'portrait' });
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 40, anchoCol = pageW - margin*2;
  const email = currentUser ? currentUser.email : '';
  const sucursal = SUCURSAL_POR_USUARIO[email] || email || '';
  const MARRON = [95,60,31], NARANJA = [199,107,63], GRIS = [138,122,99], LINEA = [226,211,186];

  let y = margin;
  function encabezado(){
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...MARRON);
    doc.text('Resumen del pedido', margin, y + 12);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...GRIS);
    doc.text('VitaPan', pageW - margin, y + 10, { align:'right' });
    if(sucursal) doc.text(sucursal, pageW - margin, y + 22, { align:'right' });
    y += 30;
    doc.text('Fecha: ' + currentDate + ' · Área: ' + AREAS[currentArea].label + ' · productos con pedido cargado', margin, y);
    y += 16;
  }
  encabezado();

  const alto = 20;
  categoriasActuales().forEach(cat=>{
    const entries = Object.entries(bucket[cat]).filter(([id,e])=> e.p !== '' && Number(e.p) > 0);
    if(entries.length === 0) return;
    if(y + 30 + alto > pageH - margin){ doc.addPage(); y = margin; }
    y += 12;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...MARRON);
    doc.text(cat.toUpperCase(), margin, y);
    y += 6;
    entries.forEach(([id, e])=>{
      if(y + alto > pageH - margin){ doc.addPage(); y = margin; }
      const nombre = (PRODUCT_BY_ID[id] && PRODUCT_BY_ID[id].name) || id;
      y += alto;
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(43,33,23);
      const txt = doc.splitTextToSize(nombre, anchoCol - 60)[0];
      doc.text(txt, margin, y - 6);
      doc.setFont('helvetica','bold'); doc.setTextColor(...NARANJA);
      doc.text(String(e.p), pageW - margin, y - 6, { align:'right' });
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.6);
      doc.line(margin, y, pageW - margin, y);
    });
  });

  entregarArchivo(doc.output('blob'), 'Resumen_' + AREAS[currentArea].label + '_' + currentDate + '.pdf', 'application/pdf');
}

function construirCuerpoCategoria(cat, bucket){
  const body = [];
  const boundaries = [];
  catalogoActual()[cat].forEach(section=>{
    boundaries.push(body.length);
    body.push([{ content: section.title, colSpan: 3, styles:{ fillColor:[227,227,227], textColor:[20,20,20], fontStyle:'bold' } }]);
    section.items.forEach(item=>{
      if(item.type === 'day'){
        body.push([{ content: item.label, colSpan: 3, styles:{ fontStyle:'italic', fillColor: false, textColor:[95,95,95] } }]);
      } else {
        const existente = bucket[cat] && bucket[cat][item.id];
        const stockPrevio = lastStock[currentArea] && lastStock[currentArea][item.id];
        const e = existente || { s: (stockPrevio ? stockPrevio.s : ''), p: '' };
        body.push([item.name, e.s !== '' ? String(e.s) : '', e.p !== '' ? String(e.p) : '']);
      }
    });
  });
  return { body, boundaries };
}

function medirAlturaCuerpo(doc, body, fontSize, cellPadding, colWidth){
  doc.setFontSize(fontSize);
  const anchoFijo = 12; // S y P ahora se ajustan al contenido (números cortos), ocupan poco
  const anchoNombre = Math.max(15, colWidth - anchoFijo*2 - cellPadding*6 - 6);
  const anchoColSpan = Math.max(15, colWidth - cellPadding*2 - 4);
  const lineH = fontSize*1.15 + cellPadding*2;
  let total = 0;
  body.forEach(row=>{
    if(row.length === 1){
      const lineas = doc.splitTextToSize(String(row[0].content), anchoColSpan).length;
      total += lineH * lineas;
    } else {
      const lineas = doc.splitTextToSize(String(row[0]), anchoNombre).length;
      total += lineH * lineas;
    }
  });
  return total * 1.05;
}


// Reparte "unidades" (secciones completas) con distinto peso en n columnas, buscando que todas
// queden del mismo alto. Primero prueba mantener el orden original; solo si reordenar mejora el
// reparto de forma notable, rellena los huecos moviendo secciones a otra columna.
// Devuelve una lista de columnas; cada columna es una lista de índices de unidades en su orden original.
function empaquetarPesos(pesos, n){
  const m = pesos.length;
  n = Math.max(1, Math.min(n, m));
  const w = pesos.map(p => Math.max(1, Math.round(p)));
  const altoMax = grupos => Math.max(...grupos.map(g => g.reduce((a,i)=>a+w[i], 0)));

  const contiguo = particionOptimaPorPeso(w, n);
  const maxContiguo = altoMax(contiguo);

  // Reparto libre: primero las secciones más grandes, siempre en la columna más vacía...
  const cols = Array.from({length:n}, ()=>[]);
  const carga = new Array(n).fill(0);
  w.map((p,i)=>i).sort((a,b)=>w[b]-w[a]).forEach(i=>{
    let k = 0;
    for(let c=1;c<n;c++) if(carga[c] < carga[k]) k = c;
    cols[k].push(i); carga[k] += w[i];
  });
  // ...y después se mejora moviendo o intercambiando secciones con la columna más cargada.
  for(let vuelta=0; vuelta<300; vuelta++){
    let a = 0;
    for(let c=1;c<n;c++) if(carga[c] > carga[a]) a = c;
    let mejor = null, mejorMax = carga[a];
    for(let b=0;b<n;b++){
      if(b === a) continue;
      cols[a].forEach(i=>{
        const nm = Math.max(carga[a]-w[i], carga[b]+w[i]);
        if(nm < mejorMax){ mejorMax = nm; mejor = { tipo:'mover', a, b, i }; }
        cols[b].forEach(j=>{
          const d = w[i]-w[j];
          if(d <= 0) return;
          const nm2 = Math.max(carga[a]-d, carga[b]+d);
          if(nm2 < mejorMax){ mejorMax = nm2; mejor = { tipo:'cambiar', a, b, i, j }; }
        });
      });
    }
    if(!mejor) break;
    if(mejor.tipo === 'mover'){
      cols[mejor.a] = cols[mejor.a].filter(x=>x!==mejor.i); cols[mejor.b].push(mejor.i);
      carga[mejor.a] -= w[mejor.i]; carga[mejor.b] += w[mejor.i];
    } else {
      const d = w[mejor.i]-w[mejor.j];
      cols[mejor.a] = cols[mejor.a].filter(x=>x!==mejor.i).concat([mejor.j]);
      cols[mejor.b] = cols[mejor.b].filter(x=>x!==mejor.j).concat([mejor.i]);
      carga[mejor.a] -= d; carga[mejor.b] += d;
    }
  }
  const libre = cols.filter(c=>c.length).map(c=>c.slice().sort((x,y)=>x-y)).sort((x,y)=>x[0]-y[0]);
  const maxLibre = altoMax(libre);

  // Si mantener el orden ya queda casi igual de parejo, se respeta el orden original.
  return (maxContiguo <= maxLibre * 1.04) ? contiguo : libre;
}

// Igual que antes pero para el PDF: las unidades son las secciones del cuerpo de la tabla.
function empaquetarUnidadesPDF(doc, body, boundaries, colWidth, n){
  const unidades = boundaries.map((b,i)=> body.slice(b, i+1 < boundaries.length ? boundaries[i+1] : body.length));
  const pesos = unidades.map(u => medirAlturaCuerpo(doc, u, 6.5, 1.3, colWidth));
  const grupos = empaquetarPesos(pesos, n);
  return grupos.map(g => [].concat(...g.map(i => unidades[i])));
}

// SOLO para hoja horizontal: como las columnas son más angostas y más numerosas, una sección grande
// (ej. Gaseosas) puede dejar una columna mucho más alta que las otras. Acá las secciones muy largas
// se pueden cortar entre productos (la continuación repite el título con "(cont.)") para que todas
// las columnas terminen a la misma altura. Si dos trozos caen en la misma columna se vuelven a unir.
function empaquetarUnidadesPDFHorizontal(doc, body, boundaries, colWidth, n){
  const alto = rows => medirAlturaCuerpo(doc, rows, 6.5, 1.3, colWidth);
  const C = alto(body) / n * 0.15;
  const trozos = [];
  boundaries.forEach((b, u)=>{
    const rows = body.slice(b, u+1 < boundaries.length ? boundaries[u+1] : body.length);
    const titulo = rows[0];
    const cont = [{ content: String(titulo[0].content) + ' (cont.)', colSpan: 3, styles: titulo[0].styles }];
    const hs = rows.map(r => alto([r]));
    const esDia = r => r.length === 1;
    const partes = [];
    let inicio = 1, acc = 0;
    for(let i=1; i<rows.length-1; i++){
      acc += hs[i];
      const resto = rows.slice(i+1);
      if(acc >= C && !esDia(rows[i]) && resto.some(r => !esDia(r))){
        partes.push(rows.slice(inicio, i+1)); inicio = i+1; acc = 0;
      }
    }
    partes.push(rows.slice(inicio));
    partes.forEach((pr, k)=> trozos.push({ u, k, rows: (k === 0 ? [titulo] : cont).concat(pr) }));
  });
  const pesos = trozos.map(t => Math.max(1, Math.round(alto(t.rows))));
  const grupos = particionOptimaPorPeso(pesos, n);
  return grupos.map(indices=>{
    const out = []; let prev = null;
    indices.forEach(ix=>{
      const t = trozos[ix];
      const rows = (prev && prev.u === t.u && t.k === prev.k + 1) ? t.rows.slice(1) : t.rows;
      rows.forEach(r => out.push(r));
      prev = t;
    });
    return out;
  });
}

// Elige los n-1 puntos de corte (siempre al inicio de una sección) que mejor reparten el alto
// estimado entre las n columnas de la hoja.
function elegirCortesMultiples(doc, body, boundaries, colWidth, n){
  if(n <= 1) return [];
  const candidatos = boundaries.filter(b=>b>0 && b<body.length);
  if(candidatos.length === 0){
    const cortes = [];
    for(let k=1;k<n;k++) cortes.push(Math.round(body.length*k/n));
    return cortes;
  }
  const refFont = 6.5, refPad = 1.3;
  const total = medirAlturaCuerpo(doc, body, refFont, refPad, colWidth);
  const alturasAcum = candidatos.map(b => ({ b, h: medirAlturaCuerpo(doc, body.slice(0,b), refFont, refPad, colWidth) }));
  const cortes = [];
  for(let k=1;k<n;k++){
    const objetivo = total * k / n;
    const prev = cortes.length ? cortes[cortes.length-1] : 0;
    let mejor = null, mejorDiff = Infinity;
    alturasAcum.forEach(({b,h})=>{
      if(b <= prev) return;
      const diff = Math.abs(h - objetivo);
      if(diff < mejorDiff){ mejorDiff = diff; mejor = b; }
    });
    if(mejor === null) mejor = Math.max(prev+1, Math.round(body.length*k/n));
    cortes.push(mejor);
  }
  return cortes;
}

function partirEnColumnas(body, cortes){
  const partes = [];
  let desde = 0;
  cortes.forEach(c=>{ partes.push(body.slice(desde, c)); desde = c; });
  partes.push(body.slice(desde));
  return partes;
}

function ajustarFuenteN(doc, bodies, colWidth, alturaDisponible){
  let fontSize = 8;
  let cellPadding = 2;
  while(fontSize > 3){
    cellPadding = Math.max(0.3, Math.min(2, fontSize*0.22));
    const headFontSize = Math.min(fontSize+0.5, 8.5);
    const altoHeader = headFontSize*1.15 + cellPadding*2;
    const alturas = bodies.map(b => medirAlturaCuerpo(doc, b, fontSize, cellPadding, colWidth) + altoHeader);
    if(Math.max(...alturas) <= alturaDisponible) break;
    fontSize -= 0.1;
  }
  return { fontSize: Math.max(fontSize, 3), cellPadding };
}

// Umbral de letra "cómoda": si con 1 columna ya se lee bien, no hace falta abrir una segunda.
const FONT_COMODO = 7.8;

// Prueba de 1 en más columnas y se queda con la menor cantidad que permite una letra cómoda
// (o, si ni con el máximo alcanza, la que mejor entra). Así una categoría chica como Lácteos
// puede quedar en 1 sola columna, y una grande sigue abriendo las columnas que necesite.
function elegirNumeroColumnas(doc, body, boundaries, maxColumnas, pageW, pageH, topY, margin, gutter){
  let mejor = null;
  for(let n=1; n<=maxColumnas; n++){
    const colWidth = (pageW - margin*2 - gutter*(n-1)) / n;
    let columnas;
    if(n > 1 && boundaries.length >= n && pageW > pageH){
      columnas = empaquetarUnidadesPDFHorizontal(doc, body, boundaries, colWidth, n);
    } else if(n > 1 && boundaries.length >= n){
      columnas = empaquetarUnidadesPDF(doc, body, boundaries, colWidth, n);
    } else {
      columnas = partirEnColumnas(body, elegirCortesMultiples(doc, body, boundaries, colWidth, n));
    }
    const alturaDisponible = pageH - topY - margin;
    const { fontSize, cellPadding } = ajustarFuenteN(doc, columnas, colWidth, alturaDisponible);
    mejor = { n, columnas, colWidth, fontSize, cellPadding };
    if(fontSize >= FONT_COMODO) break;
  }
  return mejor;
}

// Mide el ancho real que necesita cada columna (Producto / S / P) de UNA columna de la hoja,
// usando el mismo texto que se va a imprimir — así la tabla que sigue puede empezar justo
// donde termina esta, sin ningún hueco entre ambas.
function medirAnchosColumna(doc, body, fontSize, cellPadding, anchoNombreMax){
  const headFontSize = Math.min(fontSize+0.5, 8.5);
  doc.setFontSize(headFontSize);
  let anchoProducto = doc.getTextWidth('Producto');
  let anchoS = doc.getTextWidth('S');
  let anchoP = doc.getTextWidth('P');

  doc.setFontSize(fontSize);
  body.forEach(row=>{
    if(row.length === 1) return; // fila de sección o de día, no cuenta para el ancho de las columnas
    const wNombre = Math.min(doc.getTextWidth(String(row[0])), anchoNombreMax);
    if(wNombre > anchoProducto) anchoProducto = wNombre;
    const wS = doc.getTextWidth(String(row[1] || ''));
    if(wS > anchoS) anchoS = wS;
    const wP = doc.getTextWidth(String(row[2] || ''));
    if(wP > anchoP) anchoP = wP;
  });

  const relleno = cellPadding*2 + 2;
  return {
    producto: anchoProducto + relleno,
    s: anchoS + relleno,
    p: anchoP + relleno
  };
}

function renderizarColumnas(doc, bodies, topY, colWidth, fontSize, cellPadding, margin, gutter){
  const anchoFijo = 12;
  const anchoNombreMax = Math.max(15, colWidth - anchoFijo*2 - cellPadding*6 - 6);

  const estiloBase = {
    styles:{ fontSize:fontSize, cellPadding:cellPadding, textColor:[20,20,20], lineColor:[180,180,180], lineWidth:0.4, overflow:'linebreak' },
    headStyles:{ fillColor:[70,70,70], textColor:255, fontSize:Math.min(fontSize+0.5, 8.5) },
    pageBreak:'avoid'
  };

  let cursorX = margin;
  bodies.forEach((b)=>{
    const anchos = medirAnchosColumna(doc, b, fontSize, cellPadding, anchoNombreMax);
    const anchoTotal = anchos.producto + anchos.s + anchos.p;

    doc.autoTable(Object.assign({
      head: [['Producto','S','P']],
      body: b,
      startY: topY,
      margin:{ left: cursorX, right: doc.internal.pageSize.getWidth() - cursorX - anchoTotal },
      tableWidth: anchoTotal,
      columnStyles:{
        0:{ cellWidth: anchos.producto },
        1:{ cellWidth: anchos.s, halign:'center' },
        2:{ cellWidth: anchos.p, halign:'center' }
      }
    }, estiloBase));

    cursorX += anchoTotal + gutter;
  });
}

function generarPDF(){
  if(!window.jspdf){
    alert('No se pudo cargar el generador de PDF. Verificá tu conexión a internet e intentá de nuevo.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4', orientation: orientacionPDF === 'l' ? 'landscape' : 'portrait' });
  const bucket = ensureDateBucket(currentDate);

  dibujarEncabezadoPDF(doc, 'PLANILLA DE PEDIDO - ' + currentCat.toUpperCase());

  const margin = 22, gutter = 0, topY = 50;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const { body, boundaries } = construirCuerpoCategoria(currentCat, bucket);
  const { columnas, colWidth, fontSize, cellPadding } = elegirNumeroColumnas(doc, body, boundaries, 5, pageW, pageH, topY, margin, gutter);

  renderizarColumnas(doc, columnas, topY, colWidth, fontSize, cellPadding, margin, gutter);

  entregarArchivo(doc.output('blob'), 'Pedido_' + currentCat.replace(/\s+/g,'_') + '_' + currentDate + '.pdf', 'application/pdf');
}

function generarPDFCombinado(cats){
  if(!window.jspdf){
    alert('No se pudo cargar el generador de PDF. Verificá tu conexión a internet e intentá de nuevo.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4', orientation: orientacionPDF === 'l' ? 'landscape' : 'portrait' });
  const bucket = ensureDateBucket(currentDate);

  dibujarEncabezadoPDF(doc, 'PLANILLA DE PEDIDO - ' + cats.map(c=>c.toUpperCase()).join(' / '));

  // Todas las categorías elegidas se unen en un solo flujo (como una sola planilla larga). Si una
  // categoría (ej. Lácteos) no llena su espacio, la siguiente sigue completando desde ahí mismo,
  // en vez de siempre arrancar una columna nueva por categoría.
  let bodyCombinado = [];
  let boundariesCombinado = [];
  cats.forEach(cat=>{
    const r = construirCuerpoCategoria(cat, bucket);
    const offset = bodyCombinado.length;
    bodyCombinado = bodyCombinado.concat(r.body);
    boundariesCombinado = boundariesCombinado.concat(r.boundaries.map(b => b + offset));
  });

  const margin = 22, gutter = 0, topY = 50;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const maxColumnasCombinado = Math.max(cats.length, 6);
  const { columnas, colWidth, fontSize, cellPadding } = elegirNumeroColumnas(doc, bodyCombinado, boundariesCombinado, maxColumnasCombinado, pageW, pageH, topY, margin, gutter);

  renderizarColumnas(doc, columnas, topY, colWidth, fontSize, cellPadding, margin, gutter);

  entregarArchivo(doc.output('blob'), 'Pedido_' + cats.map(c=>c.replace(/\s+/g,'_')).join('_') + '_' + currentDate + '.pdf', 'application/pdf');
}

// ---------- Excel ----------
const COLOR_HEADER = 'FF464646';
const COLOR_SECCION = 'FFE3E3E3';
const COLOR_DIA = 'FFF4D9C6';
const COLOR_BORDE = 'FFB4B4B4';

const bordeFino = { top:{style:'thin', color:{argb:COLOR_BORDE}}, left:{style:'thin', color:{argb:COLOR_BORDE}}, bottom:{style:'thin', color:{argb:COLOR_BORDE}}, right:{style:'thin', color:{argb:COLOR_BORDE}} };

function escribirEncabezadoExcel(ws, colOffset, fila){
  ['Producto','S','P'].forEach((txt,i)=>{
    const c = ws.getCell(fila, colOffset+i);
    c.value = txt;
    c.font = { bold:true, color:{argb:'FFFFFFFF'} };
    c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLOR_HEADER} };
    c.border = bordeFino;
    c.alignment = { horizontal: i===0 ? 'left' : 'center' };
  });
}

// Escribe una sección (título + productos) y devuelve cuántas filas ocupó y el nombre más largo.
function escribirSeccionExcel(ws, cat, section, bucket, colOffset, filaInicio){
  let fila = filaInicio;
  let anchoMax = 10;

  ws.mergeCells(fila, colOffset, fila, colOffset+2);
  const c = ws.getCell(fila, colOffset);
  c.value = section.title;
  c.font = { bold:true };
  c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLOR_SECCION} };
  for(let cc=colOffset; cc<=colOffset+2; cc++) ws.getCell(fila, cc).border = bordeFino;
  if(section.title.length > anchoMax) anchoMax = section.title.length;
  fila++;

  section.items.forEach(item=>{
    if(item.type === 'day'){
      ws.mergeCells(fila, colOffset, fila, colOffset+2);
      const dc = ws.getCell(fila, colOffset);
      dc.value = item.label;
      dc.font = { italic:true, color:{argb:'FF5F5F5F'} };
      dc.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLOR_DIA} };
      for(let cc=colOffset; cc<=colOffset+2; cc++) ws.getCell(fila, cc).border = bordeFino;
      fila++;
    } else {
      const existente = bucket[cat] && bucket[cat][item.id];
      const stockPrevio = lastStock[currentArea] && lastStock[currentArea][item.id];
      const e = existente || { s: (stockPrevio ? stockPrevio.s : ''), p: '' };
      const nombreCell = ws.getCell(fila, colOffset);
      const sCell = ws.getCell(fila, colOffset+1);
      const pCell = ws.getCell(fila, colOffset+2);
      nombreCell.value = item.name;
      sCell.value = e.s !== '' ? Number(e.s) : null;
      pCell.value = e.p !== '' ? Number(e.p) : null;
      sCell.alignment = { horizontal:'center' };
      pCell.alignment = { horizontal:'center' };
      [nombreCell, sCell, pCell].forEach(cl=> cl.border = bordeFino);
      if(item.name.length > anchoMax) anchoMax = item.name.length;
      fila++;
    }
  });
  return { filas: fila - filaInicio, anchoMax };
}

function ajustarAnchosExcel(ws, colOffset, anchoMax){
  ws.getColumn(colOffset).width = Math.min(anchoMax + 2, 45);
  ws.getColumn(colOffset+1).width = 7;
  ws.getColumn(colOffset+2).width = 7;
}

// Bloque de una categoría completa (encabezado + todas sus secciones) para el Excel de una sola pestaña.
function escribirBloqueCategoriaExcel(ws, cat, bucket, colOffset, filaInicio){
  let fila = filaInicio, anchoMax = 10;
  escribirEncabezadoExcel(ws, colOffset, fila);
  fila++;
  catalogoActual()[cat].forEach(section=>{
    const r = escribirSeccionExcel(ws, cat, section, bucket, colOffset, fila);
    fila += r.filas;
    if(r.anchoMax > anchoMax) anchoMax = r.anchoMax;
  });
  ajustarAnchosExcel(ws, colOffset, anchoMax);
  return fila - filaInicio;
}


// ---------- Entrega del archivo generado: descargar o enviar por correo ----------
let archivoListo = null;
function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function entregarArchivo(blob, nombre, mime){
  archivoListo = { blob, nombre, mime };
  const root = document.getElementById('modalRoot');
  const esPDF = nombre.toLowerCase().endsWith('.pdf');
  let html = '<div class="modal-overlay" id="ovEntrega"><div class="modal">';
  html += '<h2>' + (esPDF ? 'PDF listo' : 'Excel listo') + '</h2>';
  html += '<div class="modal-sub">' + nombre + '</div>';
  html += '<div style="display:flex;gap:8px;margin-top:10px;">';
  html += '<button class="modal-close" id="btnEntregaDescargar" style="margin-top:0;flex:1;background:var(--ok);">Descargar</button>';
  html += '<button class="modal-close" id="btnEntregaCorreo" style="margin-top:0;flex:1;">Compartir / Enviar</button>';
  html += '</div>';
  html += '<button class="modal-close" id="btnEntregaCerrar" style="background:#8a7a63;">Cerrar</button>';
  html += '<div class="modal-sub" style="margin-top:10px;">"Compartir / Enviar" abre tus apps (WhatsApp, Gmail, etc.) con el archivo ya adjunto.</div>';
  html += '</div></div>';
  root.innerHTML = html;
  document.getElementById('ovEntrega').addEventListener('click', (e)=>{ if(e.target.id === 'ovEntrega') root.innerHTML = ''; });
  document.getElementById('btnEntregaCerrar').onclick = ()=>{ root.innerHTML = ''; };
  document.getElementById('btnEntregaDescargar').onclick = ()=>{ descargarBlob(blob, nombre); };
  document.getElementById('btnEntregaCorreo').onclick = enviarArchivoPorCorreo;
}
async function enviarArchivoPorCorreo(){
  const { blob, nombre, mime } = archivoListo;
  const email = currentUser ? currentUser.email : '';
  const sucursal = SUCURSAL_POR_USUARIO[email] || email || '';
  const asunto = 'Pedido ' + AREAS[currentArea].label + ' - ' + currentDate + (sucursal ? ' - ' + sucursal : '');
  const cuerpo = 'Adjunto el pedido de ' + AREAS[currentArea].label + ' del ' + currentDate + (sucursal ? ' (' + sucursal + ')' : '') + '.\n\nVitaPan';
  const file = new File([blob], nombre, { type: mime });
  try{
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: asunto, text: cuerpo });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // el usuario cerró el menú
  }
  // Respaldo (PC o navegador sin compartir archivos): descarga el archivo y abre el correo para adjuntarlo a mano.
  descargarBlob(blob, nombre);
  alert('Tu navegador no permite adjuntar automáticamente. Se descargó el archivo; se abrirá el correo para que lo adjuntes.');
  window.location.href = 'mailto:?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);
}

async function descargarWorkbook(workbook, nombreArchivo){
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  entregarArchivo(blob, nombreArchivo, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

// Reparte una lista ordenada de "pesos" (cantidad de filas de cada categoría) en n grupos
// contiguos, buscando la partición que minimiza el grupo más cargado (la más pareja posible).
// Es el mismo problema que "repartir cajas de distinto peso en n camiones sin reordenarlas".
function particionOptimaPorPeso(pesos, n){
  if(n <= 1) return [pesos.map((_,i)=>i)];
  const total = pesos.reduce((a,b)=>a+b, 0);
  let lo = Math.max(...pesos), hi = total;

  function gruposNecesarios(limite){
    let grupos = 1, acumulado = 0;
    for(const p of pesos){
      if(acumulado + p > limite){ grupos++; acumulado = p; }
      else acumulado += p;
    }
    return grupos;
  }

  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(gruposNecesarios(mid) <= n) hi = mid; else lo = mid + 1;
  }

  const limite = lo;
  const grupos = [];
  let actual = [], acumulado = 0;
  pesos.forEach((p, i)=>{
    if(acumulado + p > limite && actual.length > 0){
      grupos.push(actual);
      actual = [];
      acumulado = 0;
    }
    actual.push(i);
    acumulado += p;
  });
  if(actual.length) grupos.push(actual);
  return grupos;
}

async function generarExcelCombinado(cats){
  if(!window.ExcelJS){
    alert('No se pudo cargar el generador de Excel. Verificá tu conexión a internet e intentá de nuevo.');
    return;
  }
  const bucket = ensureDateBucket(currentDate);
  const workbook = new ExcelJS.Workbook();
  const ws = workbook.addWorksheet('Pedido combinado'.slice(0,31));

  // Se reparten las SECCIONES (no las categorías enteras) en 3 columnas del mismo alto: si una
  // sección es corta, el hueco de abajo se completa con otra sección que entre.
  const unidades = [];
  cats.forEach(cat=> catalogoActual()[cat].forEach(section=> unidades.push({ cat, section, peso: 1 + section.items.length })));
  const n = Math.min(3, unidades.length);
  const columnas = empaquetarPesos(unidades.map(u=>u.peso), n);

  columnas.forEach((indices, colIdx)=>{
    const colOffset = 1 + colIdx*3;
    let fila = 1, anchoMax = 10;
    escribirEncabezadoExcel(ws, colOffset, fila);
    fila++;
    indices.forEach(ix=>{
      const u = unidades[ix];
      const r = escribirSeccionExcel(ws, u.cat, u.section, bucket, colOffset, fila);
      fila += r.filas;
      if(r.anchoMax > anchoMax) anchoMax = r.anchoMax;
    });
    ajustarAnchosExcel(ws, colOffset, anchoMax);
  });

  await descargarWorkbook(workbook, 'Pedido_' + cats.map(c=>c.replace(/\s+/g,'_')).join('_') + '_' + currentDate + '.xlsx');
}

function abrirSelectorCombinado(min, max){
  const root = document.getElementById('modalRoot');
  const rango = (min === max) ? ('Marcá exactamente ' + min + ' categorías') : ('Marcá entre ' + min + ' y ' + max + ' categorías');
  let html = '<div class="modal-overlay" id="ovCombinado"><div class="modal">';
  html += '<h2>Combinar pestañas en una hoja</h2>';
  html += '<div class="modal-sub">' + rango + '</div>';
  html += '<ul style="list-style:none;padding:0;margin:0;">';
  categoriasActuales().forEach((cat,i)=>{
    html += '<li style="padding:8px 0;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:8px;">'
      + '<input type="checkbox" class="chkCombo" value="' + cat + '" id="chkCombo' + i + '">'
      + '<label for="chkCombo' + i + '" style="font-size:.85rem;">' + cat + '</label></li>';
  });
  html += '</ul>';
  html += '<div style="display:flex;gap:8px;margin-top:14px;">';
  html += '<button class="modal-close" id="generarCombinadoPDF" style="margin-top:0;flex:1;">PDF</button>';
  html += '<button class="modal-close" id="generarCombinadoExcel" style="margin-top:0;flex:1;background:var(--ok);">Excel</button>';
  html += '</div>';
  html += '</div></div>';
  root.innerHTML = html;
  document.getElementById('ovCombinado').addEventListener('click', (e)=>{ if(e.target.id === 'ovCombinado') root.innerHTML = ''; });

  function leerSeleccion(){
    const seleccion = Array.from(document.querySelectorAll('.chkCombo:checked')).map(el=>el.value);
    if(seleccion.length < min || seleccion.length > max){
      alert(rango + '.');
      return null;
    }
    return seleccion;
  }

  document.getElementById('generarCombinadoPDF').onclick = ()=>{
    const seleccion = leerSeleccion();
    if(!seleccion) return;
    root.innerHTML = '';
    generarPDFCombinado(seleccion);
  };
  document.getElementById('generarCombinadoExcel').onclick = ()=>{
    const seleccion = leerSeleccion();
    if(!seleccion) return;
    root.innerHTML = '';
    generarExcelCombinado(seleccion);
  };
}
